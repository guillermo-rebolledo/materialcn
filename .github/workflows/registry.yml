# Publishes the site to GitHub Pages: the playground at the root, and the
# registry under /r, so
#
#   npx shadcn add @materialcn/button
#
# resolves. The item URLs baked into the JSON come from REGISTRY_URL in
# scripts/generate-registry.mjs; change both together if the host moves.
#
# Needs Pages enabled for the repository with "GitHub Actions" as the source.
name: registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pinned here rather than in a `packageManager` field, which would also
      # take over local shells.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      # Validates the built registry against the CLI's own schemas — the last
      # gate before it is public. The story tests are left to `pnpm test`;
      # they need a browser and check nothing about the registry.
      - run: pnpm test:registry
      # Vite copies public/ into dist/ verbatim, so the registry JSON written
      # above rides along at /r untouched — no hashing, no transform.
      - run: pnpm build:playground
        env:
          PAGES_BASE: /materialcn/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
